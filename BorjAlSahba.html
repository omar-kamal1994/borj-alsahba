<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برج الصحبة - إدارة العمارة السكنية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e293b', // Slate 800
                        secondary: '#0f172a', // Slate 900
                        accent: '#d97706', // Amber 600
                        accentLight: '#f59e0b', // Amber 500
                        lightBg: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo for Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Frame Container -->
    <div id="app-container" class="w-full max-w-md bg-slate-900 sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col h-screen sm:h-[900px] border border-slate-800 relative">
        
        <!-- TOP APP HEADER -->
        <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center z-20 shrink-0">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center text-white font-bold shadow-md shadow-amber-900/40">
                    <i class="fa-solid fa-building text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight text-white">برج الصحبة</h1>
                    <p class="text-xs text-amber-400 font-medium" id="header-user-badge">زائر</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 space-x-reverse">
                <!-- Notifications Bell -->
                <button onclick="openModal('notifications-modal')" class="relative p-2 text-slate-300 hover:text-white transition rounded-full hover:bg-slate-800">
                    <i class="fa-solid fa-bell text-lg"></i>
                    <span id="unread-badge" class="absolute top-1 right-1 w-2 h-2 bg-amber-500 rounded-full animate-pulse"></span>
                </button>
                <!-- Login / Logout / Profile Button -->
                <button onclick="openAuthModal()" id="auth-header-btn" class="bg-amber-600 hover:bg-amber-500 text-xs text-white font-semibold px-3 py-1.5 rounded-xl transition flex items-center space-x-1 space-x-reverse shadow">
                    <i class="fa-solid fa-right-to-bracket ml-1"></i>
                    <span id="auth-btn-text">دخول</span>
                </button>
            </div>
        </header>

        <!-- MAIN SCROLLABLE CONTENT AREA -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24 relative bg-slate-900">
            <!-- Dynamic pages injected here -->
        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-2 py-2 flex justify-around items-center z-30 shadow-lg">
            <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-slate-400 hover:text-amber-400 transition" data-tab="home">
                <i class="fa-solid fa-house text-lg mb-1"></i>
                <span class="text-[10px] font-medium">الرئيسية</span>
            </button>
            <button onclick="switchTab('apartments')" class="nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-slate-400 hover:text-amber-400 transition" data-tab="apartments">
                <i class="fa-solid fa-people-roof text-lg mb-1"></i>
                <span class="text-[10px] font-medium">الشقق</span>
            </button>
            <button onclick="switchTab('announcements')" class="nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-slate-400 hover:text-amber-400 transition" data-tab="announcements">
                <i class="fa-solid fa-bullhorn text-lg mb-1"></i>
                <span class="text-[10px] font-medium">الإعلانات</span>
            </button>
            <button onclick="switchTab('dues')" class="nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-slate-400 hover:text-amber-400 transition" data-tab="dues">
                <i class="fa-solid fa-file-invoice-dollar text-lg mb-1"></i>
                <span class="text-[10px] font-medium">الاشتراكات</span>
            </button>
            <button onclick="switchTab('finances')" class="nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-slate-400 hover:text-amber-400 transition" data-tab="finances">
                <i class="fa-solid fa-wallet text-lg mb-1"></i>
                <span class="text-[10px] font-medium">المالية</span>
            </button>
            <button onclick="switchTab('staff')" class="nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-slate-400 hover:text-amber-400 transition" data-tab="staff">
                <i class="fa-solid fa-user-tie text-lg mb-1"></i>
                <span class="text-[10px] font-medium">البواب</span>
            </button>
        </nav>

    </div>

    <!-- MODALS CONTAINER -->
    <!-- Login Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-right-to-bracket text-amber-500"></i> تسجيل دخول الشقة
                </h3>
                <button onclick="closeModal('auth-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-400 mb-4">أدخل رقم الشقة تماماً كما هو مسجل (مثال: شقة 101) ورقم الهاتف:</p>
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="text-[11px] text-slate-400 mb-1 block">رقم الشقة (اسم المستخدم)</label>
                    <input type="text" id="login-apt" placeholder="شقة 101" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 mb-1 block">رقم الهاتف (كلمة المرور للمالك)</label>
                    <input type="password" id="login-phone" placeholder="01012345678" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs transition shadow-md">دخول للمالك</button>
            </form>
        </div>
    </div>

    <!-- Unpaid Residents Modal (Interactive link modal) -->
    <div id="unpaid-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-invoice text-red-400"></i> تفاصيل الشقق المتأخرة لشهر <span id="modal-unpaid-month"></span>
                </h3>
                <button onclick="closeModal('unpaid-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="unpaid-modal-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                <!-- Injected dynamically -->
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-end">
                <button onclick="closeModal('unpaid-modal')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold transition">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notifications-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-bell text-amber-500"></i> الإشعارات والتنبيهات
                </h3>
                <button onclick="closeModal('notifications-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="notifications-list" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="custom-alert-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-5 shadow-2xl text-center">
            <div id="alert-icon" class="w-12 h-12 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-xl mx-auto mb-3">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>
            <h4 id="alert-title" class="font-bold text-white text-base mb-1">تنبيه</h4>
            <p id="alert-message" class="text-xs text-slate-300 mb-4 leading-relaxed"></p>
            <button onclick="closeModal('custom-alert-modal')" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs transition">حسناً</button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC & STATE -->
    <script>
        const DEFAULT_DATA = {
            currentUser: null, // { number, owner, role: 'admin'|'resident', phone }
            activeTab: 'home',
            announcements: [
                { id: 1, title: 'صيانة دورية للمصعد', text: 'سيتم توقف المصعد يوم الخميس القادم من الساعة 10 صباحاً حتى 2 ظهراً.', date: '2026-06-10', urgent: true, approved: true, author: 'الإدارة' },
                { id: 2, title: 'موعد اجتماع اتحاد الشقاق', text: 'دعوة لجميع الملاك لحضور الاجتماع النصف سنوي في الطابق الأرضي.', date: '2026-06-08', urgent: false, approved: true, author: 'الإدارة' }
            ],
            pendingAnnouncements: [
                { id: 101, title: 'بيع أثاث منزلي بحالة ممتازة', text: 'مكتب وجلوس للبيع بسبب السفر.', date: '2026-06-11', author: 'شقة 102', image: 'https://placehold.co/400x200/1e293b/f59e0b?text=Furniture' }
            ],
            apartments: [
                { id: 1, number: 'شقة 101', owner: 'أحمد محمود إبراهيم', phone: '01012345678', car: 'ملاكي القاهرة - أ ب ج 1234', count: 1, role: 'admin', hasTenant: false, tenantName: '', tenantPhone: '' },
                { id: 2, number: 'شقة 102', owner: 'محمد علي حسن', phone: '01198765432', car: 'بدون سيارة', count: 1, role: 'resident', hasTenant: true, tenantName: 'إبراهيم السيد', tenantPhone: '01211112222' },
                { id: 3, number: 'شقة 201', owner: 'مهندس سامح عبد الله', phone: '01234567890', car: 'دبابة الإسكندرية', count: 1, role: 'admin', hasTenant: false, tenantName: '', tenantPhone: '' },
                { id: 4, number: 'شقة 301', owner: 'دكتورة ميرفت فؤاد', phone: '01555443322', car: 'ملاكي الجيزة', count: 1, role: 'resident', hasTenant: false, tenantName: '', tenantPhone: '' },
                { id: 5, number: 'محل تجاري أرضي 1', owner: 'الحاج جابر الصياد', phone: '01000000001', car: 'لا ينطبق', count: 1, role: 'resident', hasTenant: false, tenantName: '', tenantPhone: '' }
            ],
            duesSettings: {
                monthlyAmount: 300 // default monthly dues per unit
            },
            dues: {
                '2026-06': {
                    'شقة 101': 'paid',
                    'شقة 102': 'pending',
                    'شقة 201': 'paid',
                    'شقة 301': 'overdue',
                    'محل تجاري أرضي 1': 'paid'
                }
            },
            currentMonth: '2026-06',
            emergencyAssessments: [
                { id: 1, title: 'إصلاح طلمبة المياه الرئيسية', amountPerUnit: 150, date: '2026-06-05', status: { 'شقة 101': 'paid', 'شقة 102': 'pending', 'شقة 201': 'paid', 'شقة 301': 'pending', 'محل تجاري أرضي 1': 'paid' } }
            ],
            expenses: [
                { id: 1, band: 'صيانة المصعد', amount: 800, date: '2026-06-02', desc: 'تغيير زيت وبلي باب الطوارئ' },
                { id: 2, band: 'كهرباء سلم', amount: 350, date: '2026-06-05', desc: 'فاتورة الكهرباء الشهرية' },
                { id: 3, band: 'نظافة', amount: 400, date: '2026-06-01', desc: 'أدوات نظافة السلالم' }
            ],
            revenues: [
                { id: 1, source: 'اشتراكات شهرية', amount: 1200, date: '2026-06-03', desc: 'تحصيل اشتراكات يونيو' },
                { id: 2, source: 'إيجار المحل الأرضي', amount: 1500, date: '2026-06-01', desc: 'مساهمة صيانة دورية' }
            ],
            staff: {
                name: 'عم حنفي محمد',
                phone: '01122334455',
                nid: '29012150102345',
                emergencyName: 'محمود (ابن البواب)',
                emergencyPhone: '01299887766',
                salary: 2500
            }
        };

        let appData = JSON.parse(localStorage.getItem('borj_sahba_data_v3')) || DEFAULT_DATA;

        function saveToStorage() {
            localStorage.setItem('borj_sahba_data_v3', JSON.stringify(appData));
        }

        function showAlert(title, message, isError = false) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            const icon = document.getElementById('alert-icon');
            if(isError) {
                icon.className = 'w-12 h-12 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center text-xl mx-auto mb-3';
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                icon.className = 'w-12 h-12 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-xl mx-auto mb-3';
                icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }
            openModal('custom-alert-modal');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function openAuthModal() {
            if (appData.currentUser) {
                appData.currentUser = null;
                saveToStorage();
                renderActiveTab();
                showAlert('تم تسجيل الخروج', 'تم تسجيل خروجك بنجاح من النظام.');
            } else {
                openModal('auth-modal');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const aptNumInput = document.getElementById('login-apt').value.trim();
            const phoneInput = document.getElementById('login-phone').value.trim();

            const apt = appData.apartments.find(a => 
                a.number.trim().toLowerCase() === aptNumInput.toLowerCase() && 
                a.phone.trim() === phoneInput
            );

            if (apt) {
                appData.currentUser = apt;
                saveToStorage();
                closeModal('auth-modal');
                renderActiveTab();
                showAlert('مرحباً بك', `تم تسجيل الدخول بنجاح لـ (${apt.number}) - المالك: ${apt.owner}`);
            } else {
                showAlert('خطأ في البيانات', 'رقم الشقة (مثل: شقة 101) أو رقم هاتف المالك (كلمة المرور) غير مطابق للبيانات المسجلة. تذكر أن المالك فقط يمكنه تسجيل الدخول.', true);
            }
        }

        function switchTab(tabName) {
            appData.activeTab = tabName;
            saveToStorage();
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.getAttribute('data-tab') === tabName) {
                    btn.classList.add('text-amber-400');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-amber-400');
                    btn.classList.add('text-slate-400');
                }
            });
            renderActiveTab();
        }

        function isAdmin() {
            return appData.currentUser && appData.currentUser.role === 'admin';
        }

        function renderActiveTab() {
            const badge = document.getElementById('header-user-badge');
            const authBtnText = document.getElementById('auth-btn-text');
            if (appData.currentUser) {
                badge.innerText = `${appData.currentUser.number} (${isAdmin() ? 'أدمن' : 'مالك'})`;
                authBtnText.innerText = 'خروج';
            } else {
                badge.innerText = 'زائر (غير مسجل)';
                authBtnText.innerText = 'دخول';
            }

            const container = document.getElementById('main-content');
            container.scrollTop = 0;

            switch(appData.activeTab) {
                case 'home': container.innerHTML = renderHomeHTML(); break;
                case 'apartments': container.innerHTML = renderApartmentsHTML(); break;
                case 'announcements': container.innerHTML = renderAnnouncementsHTML(); break;
                case 'dues': container.innerHTML = renderDuesHTML(); break;
                case 'finances': container.innerHTML = renderFinancesHTML(); break;
                case 'staff': container.innerHTML = renderStaffHTML(); break;
                default: container.innerHTML = renderHomeHTML();
            }
            renderNotificationsBadge();
        }

        function renderNotificationsBadge() {
            const list = document.getElementById('notifications-list');
            const allItems = [...appData.announcements];
            if(isAdmin()) {
                appData.pendingAnnouncements.forEach(p => allItems.unshift({title: 'إعلان بانتظار الموافقة: ' + p.title, text: p.text, date: p.date}));
            }
            list.innerHTML = allItems.map(item => `
                <div class="p-3 bg-slate-800/80 rounded-xl border border-slate-700/60">
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-xs text-white flex items-center gap-1.5"><i class="fa-solid fa-bullhorn text-amber-500"></i> ${item.title}</span>
                        <span class="text-[10px] text-slate-400">${item.date}</span>
                    </div>
                    <p class="text-[11px] text-slate-300 leading-relaxed">${item.text}</p>
                </div>
            `).join('');
        }

        // --- 1. HOME DASHBOARD ---
        function renderHomeHTML() {
            const totalApts = appData.apartments.length;
            const currentMonthDues = appData.dues[appData.currentMonth] || {};
            const paidCount = Object.values(currentMonthDues).filter(v => v === 'paid').length;
            const collectionRate = totalApts > 0 ? Math.round((paidCount / totalApts) * 100) : 0;
            
            const totalExpenses = appData.expenses.reduce((a, c) => a + Number(c.amount), 0);
            const totalRevenues = appData.revenues.reduce((a, c) => a + Number(c.amount), 0);
            const netBalance = totalRevenues - totalExpenses;

            const unpaidList = appData.apartments.filter(a => (currentMonthDues[a.number] || 'pending') !== 'paid');
            const latestUrgent = appData.announcements.find(a => a.urgent && a.approved) || appData.announcements[0];

            return `
                <div class="p-4 space-y-4 animate-fade-in">
                    ${latestUrgent ? `
                        <div class="bg-gradient-to-r from-amber-600/20 to-amber-900/40 border border-amber-500/40 rounded-2xl p-4 shadow-lg">
                            <div class="flex items-center space-x-2 space-x-reverse mb-1.5">
                                <span class="flex h-2.5 w-2.5 relative">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
                                </span>
                                <span class="text-xs font-bold text-amber-400">تنبيه إداري عاجل</span>
                            </div>
                            <h3 class="font-bold text-white text-sm mb-1">${latestUrgent.title}</h3>
                            <p class="text-xs text-slate-300 leading-relaxed">${latestUrgent.text}</p>
                        </div>
                    ` : ''}

                    <!-- Financial & Collection Statistics -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3.5 flex flex-col justify-between shadow">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[11px] text-slate-400">تحصيل الاشتراكات</span>
                                <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-chart-pie"></i>
                                </div>
                            </div>
                            <div>
                                <div class="text-xl font-black text-white">${collectionRate}%</div>
                                <div class="text-[10px] text-emerald-400 mt-0.5">${paidCount} من ${totalApts} شقق دافعة</div>
                            </div>
                        </div>

                        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3.5 flex flex-col justify-between shadow">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[11px] text-slate-400">صافي الخزينة</span>
                                <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-wallet"></i>
                                </div>
                            </div>
                            <div>
                                <div class="text-xl font-black text-white">${netBalance} <span class="text-[10px] text-slate-400">ج.م</span></div>
                                <div class="text-[10px] text-slate-400 mt-0.5">إجمالي إيراد - مصاريف</div>
                            </div>
                        </div>
                    </div>

                    <!-- Detailed Transparency Stats (Visible to All) -->
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 shadow space-y-3">
                        <h4 class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
                            <i class="fa-solid fa-eye"></i> الشفافية المالية والاشتراكات المتأخرة
                        </h4>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-700">

        function openApartmentModal(aptId = null) {

            document.getElementById('apt-edit-id').value = '';
            document.getElementById('apt-number').value = '';
            document.getElementById('apt-owner').value = '';
            document.getElementById('apt-phone').value = '';
            document.getElementById('apt-role').value = 'resident';
            document.getElementById('apt-car').value = '';
            document.getElementById('apt-has-tenant').checked = false;
            document.getElementById('tenant-section').classList.add('hidden');
            document.getElementById('apt-tenant-name').value = '';
            document.getElementById('apt-tenant-phone').value = '';
            document.getElementById('apt-modal-title').innerText = 'إضافة شقة جديدة';

            if(aptId) {
                const apt = appData.apartments.find(a => a.id === aptId);
                if(apt) {
                    document.getElementById('apt-edit-id').value = apt.id;
                    document.getElementById('apt-number').value = apt.number;
                    document.getElementById('apt-owner').value = apt.owner;
                    document.getElementById('apt-phone').value = apt.phone;
                    document.getElementById('apt-role').value = apt.role || 'resident';
                    document.getElementById('apt-car').value = apt.car;
                    document.getElementById('apt-has-tenant').checked = apt.hasTenant || false;
                    if(apt.hasTenant) document.getElementById('tenant-section').classList.remove('hidden');
                    document.getElementById('apt-tenant-name').value = apt.tenantName || '';
                    document.getElementById('apt-tenant-phone').value = apt.tenantPhone || '';
                    document.getElementById('apt-modal-title').innerText = 'تعديل الشقة وصلاحية الأدمن';
                }
            }
            openModal('apartment-modal');
        }

        function saveApartment(e) {
            e.preventDefault();
            const editId = document.getElementById('apt-edit-id').value;
            const number = document.getElementById('apt-number').value;
            const owner = document.getElementById('apt-owner').value;
            const phone = document.getElementById('apt-phone').value;
            const role = document.getElementById('apt-role').value;
            const car = document.getElementById('apt-car').value;
            const hasTenant = document.getElementById('apt-has-tenant').checked;
            const tenantName = document.getElementById('apt-tenant-name').value;
            const tenantPhone = document.getElementById('apt-tenant-phone').value;

            if(editId) {
                const idx = appData.apartments.findIndex(a => a.id == editId);
                if(idx !== -1) {
                    appData.apartments[idx] = { id: Number(editId), number, owner, phone, role, car, count: 1, hasTenant, tenantName, tenantPhone };
                }
            } else {
                appData.apartments.push({ id: Date.now(), number, owner, phone, role, car, count: 1, hasTenant, tenantName, tenantPhone });
                // WhatsApp notification
                const message = `مرحباً أ/ ${owner}، تم تسجيل شقتك (${number}) في نظام برج الصحبة. اسم المستخدم للدخول: ${number} وكلمة المرور: ${phone}`;
                const waUrl = `https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(message)}`;
                window.open(waUrl, '_blank');
            }

            saveToStorage();
            closeModal('apartment-modal');
            renderActiveTab();
            showAlert('تم الحفظ', 'تم حفظ بيانات الشقة وصلاحيات الأدمن بنجاح.');
        }

            if(!isAdmin()) return;
            appData.apartments = appData.apartments.filter(a => a.id !== id);
            saveToStorage();
            renderActiveTab();
            showAlert('تم الحذف', 'تم حذف الشقة بنجاح.');

        function openAddAnnouncementModal() {
            if(!appData.currentUser) {

                openAuthModal();
                return;
            }
            openModal('announcement-modal');
        }

        function submitResidentAnnouncement(e) {
            e.preventDefault();
            const title = document.getElementById('res-ann-title').value;
            const text = document.getElementById('res-ann-text').value;
            const image = document.getElementById('res-ann-img').value;
            const today = new Date().toISOString().split('T')[0];

            appData.pendingAnnouncements.push({
                id: Date.now(),
                title, text, image, date: today, author: appData.currentUser.number
            });
            saveToStorage();
            closeModal('announcement-modal');
            renderActiveTab();
            showAlert('تم الإرسال بنجاح', 'تم إرسال إعلانك للأدمن للمراجعة وسيتم نشره فور الموافقة عليه.');
        }

        function approveAnnouncement(id) {
            if(!isAdmin()) return;
            const idx = appData.pendingAnnouncements.findIndex(p => p.id === id);
            if(idx !== -1) {
                const item = appData.pendingAnnouncements[idx];
                item.approved = true;
                appData.announcements.unshift(item);
                appData.pendingAnnouncements.splice(idx, 1);
                saveToStorage();
                renderActiveTab();
                showAlert('تم النشر', 'تمت الموافقة على الإعلان ونشره بنجاح.');
            }
        }

        function rejectAnnouncement(id) {
            if(!isAdmin()) return;
            appData.pendingAnnouncements = appData.pendingAnnouncements.filter(p => p.id !== id);
            saveToStorage();
            renderActiveTab();
            showAlert('تم الرفض', 'تم رفض وحذف الإعلان.');
        }

        function deletePublishedAnnouncement(id) {
            if(!isAdmin()) return;
            appData.announcements = appData.announcements.filter(a => a.id !== id);
            saveToStorage();
            renderActiveTab();
            showAlert('تم الحذف', 'تم حذف الإعلان.');
        }

            appData.apartments.forEach(a => statusMap[a.number] = 'pending');

            });

            if(!isAdmin()) return;

                saveToStorage();
                renderActiveTab();

                    <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-5 shadow-xl space-y-3">
                        <div class="flex items-center space-x-3 space-x-reverse pb-3 border-b border-slate-700">
                            <div class="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-user-tie"></i></div>
                            <div>
                                <h3 class="font-bold text-lg text-white">${staff.name}</h3>
                                <span class="text-xs text-amber-400">مسؤول أمن ونظافة برج الصحبة</span>
                            </div>
                        </div>

                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between bg-slate-900 p-2.5 rounded-xl border border-slate-700">
                                <span class="text-slate-400">رقم الهاتف</span>
                                <span dir="ltr" class="font-bold text-white">${staff.phone}</span>
                            </div>
                            <div class="flex justify-between bg-slate-900 p-2.5 rounded-xl border border-slate-700">
                                <span class="text-slate-400">رقم البطاقة</span>
                                <span dir="ltr" class="font-bold text-white">${staff.nid}</span>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-700">
                            <h4 class="font-bold text-xs text-red-400 mb-2"><i class="fa-solid fa-triangle-exclamation"></i> طوارئ قريب البواب</h4>
                            <div class="bg-red-500/10 border border-red-500/20 rounded-xl p-3 flex justify-between items-center text-xs">
                                <div>
                                    <div class="font-bold text-white">${staff.emergencyName}</div>
                                </div>
                                <a href="tel:${staff.emergencyPhone}" class="bg-red-600 text-white px-3 py-1.5 rounded-lg font-bold" dir="ltr"><i class="fa-solid fa-phone"></i> ${staff.emergencyPhone}</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Staff Edit Modal -->
                <div id="staff-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 shadow-2xl">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-base font-bold text-white">تعديل بيانات البواب</h3>
                            <button onclick="closeModal('staff-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onsubmit="saveStaff(event)" class="space-y-3">
                            <input type="text" id="staff-name" placeholder="اسم البواب" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <input type="tel" id="staff-phone" placeholder="هاتف البواب" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <input type="text" id="staff-nid" placeholder="الرقم القومي" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <input type="text" id="staff-emerg-name" placeholder="اسم قريب البواب للطوارئ" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <input type="tel" id="staff-emerg-phone" placeholder="هاتف قريب البواب" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <button type="submit" class="w-full py-2.5 bg-amber-600 text-white font-bold rounded-xl text-xs">حفظ</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function openStaffModal() {
            if(!isAdmin()) return;
            document.getElementById('staff-name').value = appData.staff.name;
            document.getElementById('staff-phone').value = appData.staff.phone;
            document.getElementById('staff-nid').value = appData.staff.nid;
            document.getElementById('staff-emerg-name').value = appData.staff.emergencyName;
            document.getElementById('staff-emerg-phone').value = appData.staff.emergencyPhone;
            openModal('staff-modal');
        }

        function saveStaff(e) {
            e.preventDefault();
            if(!isAdmin()) return;
            appData.staff = {
                name: document.getElementById('staff-name').value,
                phone: document.getElementById('staff-phone').value,
                nid: document.getElementById('staff-nid').value,
                emergencyName: document.getElementById('staff-emerg-name').value,
                emergencyPhone: document.getElementById('staff-emerg-phone').value,
                salary: appData.staff.salary
            };
            saveToStorage();
            closeModal('staff-modal');
            renderActiveTab();
            showAlert('تم التحديث', 'تم تحديث بيانات البواب بنجاح.');
        }

        window.onload = function() {
            switchTab(appData.activeTab);
        };
    </script>
</body>
</html>
